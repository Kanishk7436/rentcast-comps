services:
  - type: web
    name: rentcast-comps
    runtime: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:10000"
    envVars:
      - key: PORT
        value: "10000"
      - key: RENTCAST_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
